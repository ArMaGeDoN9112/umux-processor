[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umux-processor"
version = "0.1.0"
description = "Configurable UMUX-Lite processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UMUX Processor Contributors" }]
dependencies = [
    "pandas>=2.1",
    "plotly>=5.18",
]

[project.optional-dependencies]
api = [
    "fastapi==0.115.12",
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
umux-process = "umux_processor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
