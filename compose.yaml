services:
  pipeline:
    build:
      context: .
      target: production
    volumes:
      - type: bind
        source: ${UMUX_INPUT_DIR:-.}
        target: /input
        read_only: true
      - type: bind
        source: ${UMUX_OUTPUT_DIR:-./output}
        target: /output

  tests:
    build:
      context: .
      target: test

  api:
    profiles: [api]
    build:
      context: .
      target: api
    ports:
      - "${UMUX_API_PORT:-8000}:8000"
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
